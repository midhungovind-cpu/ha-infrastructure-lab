<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">HA Infrastructure Lab simulator architecture</title>
  <desc id="desc">Fictional browser simulator with 54 hosts, 6 virtual machines, three primary-site VIPs, and a manually promoted recovery site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c1c33"/></linearGradient>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d3943"/><stop offset="1" stop-color="#103047"/></linearGradient>
    <linearGradient id="rh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#27244b"/><stop offset="1" stop-color="#37275f"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".32"/></filter>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#32d7d5"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a78bfa"/></marker>
    <style>
      .title{font:700 44px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7ff}.subtitle{font:400 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#a9b8ce}.site{font:700 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7ff}.meta{font:600 15px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.2px}.bt{font:700 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7ff}.body{font:400 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b7c4d8}.small{font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#91a5c0}.label{font:700 12px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.1px}.stat{font:700 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7ff}.sl{font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#91a5c0}.card{fill:#101f35;stroke:#334b6d;stroke-width:2}.pcard{fill:#0d2436;stroke:#2bc8cb;stroke-width:2}.rcard{fill:#171d3a;stroke:#8d76ed;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1450" cy="-60" r="310" fill="#183250" opacity=".45"/><circle cx="80" cy="1010" r="280" fill="#18264c" opacity=".55"/>
  <text x="60" y="72" class="title">HA Infrastructure Lab</text><text x="60" y="108" class="subtitle">Actual simulator topology · stateful browser lab · fictional infrastructure</text>
  <rect x="1060" y="42" width="480" height="78" rx="18" fill="#0e1c30" stroke="#2b405f" stroke-width="2"/>
  <text x="1090" y="75" class="stat">54</text><text x="1090" y="98" class="sl">simulated hosts</text><text x="1202" y="75" class="stat">6</text><text x="1202" y="98" class="sl">virtual machines</text><text x="1310" y="75" class="stat">3</text><text x="1310" y="98" class="sl">primary VIPs</text><text x="1430" y="75" class="stat">17</text><text x="1430" y="98" class="sl">exercises</text>

  <rect x="56" y="148" width="1010" height="730" rx="24" fill="#09192b" stroke="#32d7d5" stroke-width="3" filter="url(#shadow)"/><path d="M80 148h962a24 24 0 0 1 24 24v40H56v-40a24 24 0 0 1 24-24z" fill="url(#ph)"/>
  <circle cx="88" cy="180" r="7" fill="#32d7d5"/><text x="108" y="188" class="site">PRIMARY SITE · ACTIVE</text><text x="845" y="186" class="meta" fill="#6ff1e7">10.10.0.0/16 · 28 HOSTS</text>
  <rect x="1110" y="148" width="434" height="730" rx="24" fill="#10152b" stroke="#987cf5" stroke-width="3" filter="url(#shadow)"/><path d="M1134 148h386a24 24 0 0 1 24 24v40h-434v-40a24 24 0 0 1 24-24z" fill="url(#rh)"/>
  <circle cx="1142" cy="180" r="7" fill="#a78bfa"/><text x="1162" y="188" class="site">RECOVERY SITE · WARM</text><text x="1160" y="237" class="meta" fill="#b9a6ff">10.20.0.0/16 · 26 DR- HOSTS</text>

  <rect x="80" y="234" width="182" height="74" rx="16" class="pcard"/><text x="171" y="263" text-anchor="middle" class="bt">Client request</text><text x="171" y="287" text-anchor="middle" class="small">simulated DNS name</text>
  <path d="M262 271h44" fill="none" stroke="#32d7d5" stroke-width="4" marker-end="url(#cyanArrow)"/>
  <rect x="316" y="224" width="208" height="94" rx="16" class="pcard"/><text x="336" y="249" class="label" fill="#6ff1e7">EDGE VIP</text><text x="336" y="278" class="bt">10.10.10.10</text><text x="336" y="301" class="small">keepalived ownership</text>
  <path d="M524 271h44" fill="none" stroke="#32d7d5" stroke-width="4" marker-end="url(#cyanArrow)"/>
  <rect x="578" y="224" width="208" height="94" rx="16" class="card"/><text x="598" y="249" class="label" fill="#70dce3">HA PROXY PAIR</text><text x="598" y="278" class="bt">haproxy01 / 02</text><text x="598" y="301" class="small">HTTP :80 · round-robin</text>
  <path d="M786 271h44" fill="none" stroke="#32d7d5" stroke-width="4" marker-end="url(#cyanArrow)"/>
  <rect x="840" y="224" width="202" height="94" rx="16" class="card"/><text x="860" y="249" class="label" fill="#70dce3">CACHE + WEB</text><text x="860" y="278" class="bt">Varnish01 / 02</text><text x="860" y="301" class="small">web01–03 · PHP-FPM</text>
  <path d="M941 318v38H259v22M941 356H614v22M941 356v22" fill="none" stroke="#32d7d5" stroke-width="3" marker-end="url(#cyanArrow)"/>

  <rect x="80" y="388" width="358" height="200" rx="18" class="card"/><text x="104" y="419" class="label" fill="#7fdfe5">DATABASE WRITE PATH</text><text x="104" y="451" class="bt">VIP 10.10.20.10</text><text x="104" y="480" class="body">mysql-core01 / mysql-core02</text><text x="104" y="505" class="small">Pacemaker + Corosync + DRBD</text><line x1="104" y1="526" x2="414" y2="526" stroke="#314763"/><text x="104" y="552" class="body">mysql-slave01 · GTID replica</text><circle cx="403" cy="548" r="6" fill="#32d7d5"/>
  <rect x="458" y="388" width="312" height="200" rx="18" class="card"/><text x="482" y="419" class="label" fill="#f2bf62">STORAGE PATH</text><text x="482" y="451" class="bt">VIP 10.10.30.10</text><text x="482" y="480" class="body">san01 / san02</text><text x="482" y="505" class="small">Pacemaker + DRBD + NFSv4</text><line x1="482" y1="526" x2="746" y2="526" stroke="#314763"/><text x="482" y="552" class="small">/exports/app → /srv/app</text>
  <rect x="790" y="388" width="252" height="200" rx="18" class="card"/><text x="814" y="419" class="label" fill="#a78bfa">WEB IMPLEMENTATION</text><text x="814" y="451" class="body">web01 / 02</text><text x="814" y="474" class="small">Nginx + PHP-FPM</text><line x1="814" y1="495" x2="1018" y2="495" stroke="#314763"/><text x="814" y="526" class="body">web03</text><text x="814" y="549" class="small">Lighttpd + PHP-FPM</text>

  <rect x="80" y="614" width="466" height="108" rx="18" class="card"/><text x="104" y="645" class="label" fill="#a78bfa">QUEUE, DATA + TRANSFER</text><text x="104" y="676" class="body">RabbitMQ01–03 · Cassandra01–03 · Elasticsearch01–03</text><text x="104" y="701" class="small">FTP01 / 02 · TLS required · passive range modelled</text>
  <rect x="566" y="614" width="476" height="108" rx="18" class="card"/><text x="590" y="645" class="label" fill="#70dce3">VIRTUALISATION + OPERATIONS</text><text x="590" y="676" class="body">kvm01 / kvm02 · 6 persisted VMs · bridged networking</text><text x="590" y="701" class="small">bastion01 access · mon01 monitoring and logs</text>
  <rect x="80" y="748" width="962" height="96" rx="18" fill="#0c2033" stroke="#2a4964" stroke-width="2"/><text x="104" y="780" class="label" fill="#6ff1e7">AUTOMATIC ONLY INSIDE THE PRIMARY SITE</text><text x="104" y="812" class="body">Edge VIP, database group and storage group may move between their two primary-site members.</text><text x="104" y="834" class="small">Ownership, DRBD role and replication state persist across reconnects and browser reloads.</text>

  <rect x="1138" y="270" width="378" height="122" rx="18" class="rcard"/><text x="1162" y="301" class="label" fill="#b9a6ff">MIRRORED SERVICE TIERS</text><text x="1162" y="333" class="body">dr-haproxy01 · dr-web01 · dr-mysql-core01</text><text x="1162" y="358" class="body">dr-san01 · dr-rabbitmq01 · dr-kvm01 · …</text><text x="1162" y="380" class="small">Warm state represented in the simulator</text>
  <rect x="1138" y="420" width="378" height="126" rx="18" fill="#221d42" stroke="#c090ff" stroke-width="2"/><text x="1162" y="452" class="label" fill="#ffcf75">NO RECOVERY VIPS BY DEFAULT</text><text x="1162" y="483" class="body">Not an automatic failover target.</text><text x="1162" y="509" class="body">Promotion requires an exercise declaration.</text><text x="1162" y="532" class="small">No external routing is simulated.</text>
  <rect x="1138" y="576" width="378" height="204" rx="18" class="rcard"/><text x="1162" y="607" class="label" fill="#b9a6ff">MANUAL RECOVERY WORKFLOW</text>
  <circle cx="1172" cy="646" r="15" fill="#6f58c9"/><text x="1172" y="651" text-anchor="middle" class="small" fill="#fff">1</text><text x="1200" y="651" class="body">Declare primary unavailable</text>
  <circle cx="1172" cy="684" r="15" fill="#6f58c9"/><text x="1172" y="689" text-anchor="middle" class="small" fill="#fff">2</text><text x="1200" y="689" class="body">Promote synchronized services</text>
  <circle cx="1172" cy="722" r="15" fill="#6f58c9"/><text x="1172" y="727" text-anchor="middle" class="small" fill="#fff">3</text><text x="1200" y="727" class="body">Switch simulated request path</text>
  <circle cx="1172" cy="760" r="15" fill="#6f58c9"/><text x="1172" y="765" text-anchor="middle" class="small" fill="#fff">4</text><text x="1200" y="765" class="body">Controlled return to primary</text>
  <path d="M1066 512h44" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#purpleArrow)"/>
  <rect x="56" y="908" width="1488" height="52" rx="14" fill="#0d1c2f" stroke="#2b405f" stroke-width="2"/><circle cx="82" cy="934" r="6" fill="#32d7d5"/><text x="101" y="940" class="body">Fictional browser-based training simulator · allowlisted commands · no host execution · no external infrastructure</text><text x="1514" y="940" text-anchor="end" class="meta" fill="#6ff1e7">HA-INFRASTRUCTURE-LAB</text>
</svg>
